[package]
name = "deepdive-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.102"
async-stream = "0.3.6"
async-trait = "0.1"
bytes = "1.11.1"
futures-util = "0.3.32"
# ripgrep's own walker — respects .gitignore/.ignore, skips hidden dirs
# (.git/.deepdive) and gitignored dirs (target/, node_modules/) for free.
ignore = "0.4"
libc = "0.2"
pathdiff = "0.2"
regex = "1"
# reqwest 0.13 renamed the TLS feature `rustls-tls` -> `rustls` (aws-lc-rs provider);
# `stream` lives in features2. Drop default-tls to keep the binary on rustls only.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "gzip", "socks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.52.3", default-features = false, features = ["rt", "macros", "sync"] }
