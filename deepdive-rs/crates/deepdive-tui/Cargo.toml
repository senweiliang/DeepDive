[package]
name = "deepdive-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "deepdive-tui"
path = "src/main.rs"

[dependencies]
deepdive-core = { path = "../deepdive-core" }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
reqwest = { version = "0.13", default-features = false }
serde_json = "1"
tokio = { version = "1.52", default-features = false, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-util = "0.7"
futures-util = "0.3"
anyhow = "1"
