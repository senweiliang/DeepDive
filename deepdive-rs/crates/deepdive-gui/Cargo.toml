# Standalone workspace so the heavy Tauri dependency tree never burdens the
# core/cli/tui builds. Depends on deepdive-core by path.
[workspace]

[package]
name = "deepdive-gui"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[[bin]]
name = "deepdive-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
deepdive-core = { path = "../deepdive-core" }
reqwest = { version = "0.13", default-features = false }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
tokio-util = "0.7"

[profile.release]
lto = "thin"
strip = true
